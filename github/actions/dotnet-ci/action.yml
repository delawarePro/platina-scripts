# OOTB features in Azure DevOps but not in GitHub:
#  - UI for test & code coverage results.
#  - Step injection for before/after test & release steps.
#     There is however a workaround by providing a composite action file instead. (See 'ci-beforeTestsSteps' below)
name: "DotNet CI"
description: "Builds, tests, packages and publishes a dotnet based solution."

inputs:
  solution:
    description: "Optional solution to process, use this if you have multiple solutions or when running on a Windows runner."
    required: false
    default: ""

  dotNetSdkVersion:
    description: "Specific .NET SDK version to use."
    required: false
    default: ""

  buildConfiguration:
    description: "Configuration name to build."
    required: false
    default: "Release"
  buildPlatform:
    description: "Platform name to build."
    required: false
    default: "Any CPU"

  postBuildDotnetArgs:
    description: "Arguments passed to dotnet commander post build dotnet tasks like test, pack and publish."
    required: false
    default: "--no-restore --no-build"

  noTests:
    description: "Whether not to run tests."
    required: false
    default: "false"
  testProjectsGlob:
   description: "Glob to match test projects."
   required: false
   default: "**/*[Tt]ests/*.csproj"
  testArguments:
    description: "Optional arguments to pass to test runner."
    required: false
    default: ""
  testCoverageArguments:
    description: "Test coverage arguments for collection."
    required: false
    default: ""

  prerelease:
    description: "Pre-release to trigger preparing packages."
    required: false
    default: ""
  withPack:
    description: "Whether to run 'dotnet package'."
    required: false
    default: "false"
  withPublish:
    description: "Whether to run 'dotnet publish' and publish to pipeline artifacts."
    required: false
    default: "false"
  withRelease:
    description: "Whether to push created NuGets to external feed and/or add publish output to pipeline artifacts."
    required: false
    default: "false"

  nuGetSourceUrl:
    description: "NuGet source URL for private feeds."
    required: false
    default: ""
  nuGetAuthToken:
    description: "NuGet authentication token for private feeds."
    required: false
    default: ""
  nuGetSymbolsAccountName:
    description: "Account name for publishing symbols to Azure Artifacts symbol server."
    required: false
    default: ""
  nuGetSymbolsToken:
    description: "Personal Access Token for publishing symbols to Azure Artifacts symbol server."
    required: false
    default: ""
  externalFeedUrl:
    description: "External feed URL for private feeds. Feed URL should be in format https://pkgs.dev.azure.com/{ORG_NAME}/{PROJECT}/_packaging/{FEED_NAME}/"
    required: false
    default: ""
  azureClientId:
    description: "Azure Client ID for authenticating with Azure Artifacts."
    required: false
    default: "" 
  azureTenantId:
    description: "Azure Tenant ID for authenticating with Azure Artifacts."
    required: false
    default: ""

  containerRegistry:
    description: "Optional container registry login server to push containers to."
    required: false
    default: ""
  containerRegistryAzureClientId:
    description: "Optional Azure Client ID for authenticating with Azure Container Registry."
    required: false
    default: ""
  containerRegistryAzureTenantId:
    description: "Optional Azure Tenant ID for authenticating with Azure Container Registry."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Login in Azure CLI context provided with a service principal.
    - uses: azure/login@v3
      if: ${{ inputs.azureClientId != '' && inputs.azureTenantId != '' }}
      name: Azure CLI Login (Azure Artifacts)
      with:
        client-id: ${{ inputs.azureClientId }}
        tenant-id: ${{ inputs.azureTenantId }}
        allow-no-subscriptions: true

    # Simplifies Azure DevOps Central Feed Service authentication. Fetches access token for Azure DevOps and sets this as an environment variale.
    # Assuming the workflow is authenticated using OIDC (Azure CLI login step).
    # Additionally it can also setup needed environment variables for nuget & npm authentication.
    - uses: microsoft/setup-cfs@main
      if: ${{ inputs.externalFeedUrl != '' }}
      name: Setup CFS
      with:
        feed-url: ${{ inputs.externalFeedUrl }}
        nuget: true
        npm-config: true

    - uses: actions/setup-dotnet@v5
      if: ${{ inputs.dotNetSdkVersion != '' || (inputs.nuGetSourceUrl != '' && inputs.nuGetAuthToken != '') }}
      name: Setup DotNet NuGet Feed
      with:
        source-url: ${{ inputs.nuGetSourceUrl }}
        dotnet-version: ${{ inputs.dotNetSdkVersion }}
      env:
        NUGET_AUTH_TOKEN: ${{ inputs.nuGetAuthToken }}
    
    # Support for '.sln' & '.slnx' files. Resolve solution file and output as variable. So this can be used for subsequent 'dotnet' commands.
    # Prefer '.slnx' over '.sln' when both are present.
    # Default only supported for Linux runners. Linux interprets wildcards and expands them before it is sent to a command.
    # When running on Windows, perhaps better to specify the solution file explicitly, for now.
    - name: Set 'SolutionFile' variable
      id: "variables"
      shell: pwsh
      run: |
        $solutionFile = ("${{ inputs.solution }}" -eq "") ? (Test-Path "*.slnx") ? "*.slnx" : (Test-Path "*.sln") ? "*.sln" : "${{ inputs.solution }}" : "${{ inputs.solution }}"
        Write-Host "Using solution file '$solutionFile'."
        "solutionFile=$solutionFile" >> $env:GITHUB_OUTPUT

    - name: DotNet Restore
      shell: pwsh
      run: dotnet restore ${{ steps.variables.outputs.solutionFile }}

    # DotNet restore doesn't restore tools in ./config/dotnet-tools.json, although documentation seems to indicate otherwise.
    # https://learn.microsoft.com/en-us/dotnet/core/tools/global-tools
    - name: DotNet Tool Restore
      shell: pwsh
      run: dotnet tool restore

    - if: ${{ hashFiles('./.github/actions/ci-beforeBuildSteps/action.yml') != '' }}
      uses: ./.github/actions/ci-beforeBuildSteps

    - name: DotNet Build
      shell: pwsh
      run: dotnet build ${{ steps.variables.outputs.solutionFile }} --configuration ${{ inputs.buildConfiguration }} /p:Platform="${{ inputs.buildPlatform}}" --no-restore

    - name: DotNet Pack
      shell: pwsh
      if: ${{ inputs.withPack == 'true' }}
      run: dotnet pack ${{ steps.variables.outputs.solutionFile }} --configuration ${{ inputs.buildConfiguration }} ${{ inputs.postBuildDotnetArgs }} --property:PackageOutputPath=${{ runner.temp }}/nugets
      # Explicitly pass parameters as environment variables for Platina packaging support.
      env:
        Prerelease: ${{ inputs.prerelease }}
        WithRelease: ${{ inputs.withRelease }}

    - name: DotNet Publish
      shell: pwsh
      if: ${{ inputs.withPublish == 'true' }}
      run: |
        dotnet publish ${{ steps.variables.outputs.solutionFile }} --configuration ${{ inputs.buildConfiguration }} ${{ inputs.postBuildDotnetArgs }} --property PublishDir=${{ runner.temp }}/packages
      # Explicitly pass parameters as environment variables for Platina publish support.
      env:
        Prerelease: ${{ inputs.prerelease }}
        WithRelease: ${{ inputs.withRelease }}

    - if: ${{ inputs.noTests != 'true' && hashFiles('./.github/actions/ci-beforeTestsSteps/action.yml') != '' }}
      uses: ./.github/actions/ci-beforeTestsSteps

    - name: DotNet Test
      if: ${{ inputs.noTests != 'true'}}
      shell: pwsh
      run: |
          # Sets test coverage default when not provided, defaults depends whether native MTP is configured with .NET 10 or not.
          # Use '--coverage' when using native MTP, '--collect "Code Coverage"' for MTP over VSTest
          $solutionDir = (Get-Item "${{ steps.variables.outputs.solutionFile }}").Directory
          $isMtp = (Get-Content (Join-Path $solutionDir "global.json") -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json).test.runner -eq "Microsoft.Testing.Platform"
          $exitCode = 0

          foreach($project in (Resolve-Path ${{ inputs.testProjectsGlob }} -ErrorAction SilentlyContinue | Get-Item))
          {
            if ( $isMtp )
            {
              # Change working directory because global.json is expected in the working directory by 'dotnet test'.
              Set-Location -Path $solutionDir
              $testCoverageArguments = ( "${{ inputs.testCoverageArguments }}" -eq "" ) ? "--coverage" : "${{ inputs.testCoverageArguments }}"
              &dotnet test --project "$($project.FullName)" --report-trx --results-directory ${{ runner.temp }} --configuration ${{ inputs.buildConfiguration }} ${{ inputs.postBuildDotnetArgs }} $testCoverageArguments ${{ inputs.testArguments }}
            }
            else
            {
              $testCoverageArguments = ( "${{ inputs.testCoverageArguments }}" -eq "" ) ? @("--collect", "Code Coverage") : "${{ inputs.testCoverageArguments }}"
              &dotnet test "$($project.FullName)" --logger trx --results-directory ${{ runner.temp }} --configuration ${{ inputs.buildConfiguration }} ${{ inputs.postBuildDotnetArgs }} $testCoverageArguments ${{ inputs.testArguments }}
            }

            if ( $LASTEXITCODE -gt $exitCode ) {
              $exitCode = $LASTEXITCODE
            }
          }
          
          exit $exitCode

    - name: Publish Test Results
      if: ${{ inputs.noTests != 'true' && always() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ${{ runner.temp }}/*.trx

    - name: Publish Code Coverage Results
      if: ${{ inputs.noTests != 'true'}}
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-results
        path: ${{ runner.temp }}/**/*.coverage

    - if: ${{ inputs.noTests != 'true' && hashFiles('./.github/actions/ci-afterTestsSteps/action.yml') != '' }}
      uses: ./.github/actions/ci-afterTestsSteps

    - if: ${{ inputs.withRelease == 'true' && (inputs.withPack == 'true' || inputs.withPublish == 'true') && hashFiles('./.github/actions/ci-beforeReleaseSteps/action.yml') != '' }}
      uses: ./.github/actions/ci-beforeReleaseSteps
  
    - name: DotNet Push
      if: ${{ inputs.withPack == 'true' && inputs.withRelease == 'true' }}
      shell: pwsh
      run: |
         foreach ($package in (Get-ChildItem -Path ${{ runner.temp }}/nugets -Recurse -Include *.nupkg, *.snupkg | Where-Object { $_.Name -notlike "*.symbols.nupkg" })) {
             dotnet nuget push $package.FullName --source "${{ inputs.nuGetSourceUrl }}" --api-key "${{ inputs.nuGetAuthToken }}"
         }

      # The above task does publish the .snupkgs, but Visual Studio can't seem to consume them from the artifact feed yet?
      # Therefore, also publish the .pdb to the SymbolServer of this organization.
      # Users can get rich debugging experience by adding the VSTS symbol server in Visual Studio.
    - name: Publish symbols to "local" symbol server too
      if: ${{ inputs.withPack == 'true' && inputs.withRelease == 'true' && inputs.nuGetSymbolsAccountName != '' &&  inputs.nuGetSymbolsToken != '' }}
      uses: microsoft/action-publish-symbols@v2.1.6
      with:
        accountName: ${{ inputs.nuGetSymbolsAccountName }}
        symbolServiceUrl: 'https://artifacts.dev.azure.com'
        # Remark: the PAT token requires more access than just Azure Artifacts
        # See: https://github.com/marketplace/actions/publish-symbols
        personalAccessToken: ${{ inputs.nuGetSymbolsToken }}

      # Login in Azure CLI context and fetch token to use as password for Docker login.
      # See: https://github.com/docker/login-action#openid-connect-oidc
    - uses: azure/login@v3
      if: ${{ inputs.withPublish == 'true' && inputs.withRelease == 'true' && inputs.containerRegistry != '' && inputs.containerRegistryAzureClientId != '' && inputs.containerRegistryAzureTenantId != '' }}
      name: Azure CLI Login (Azure Container Registry)
      with:
        client-id: ${{ inputs.containerRegistryAzureClientId }}
        tenant-id: ${{ inputs.containerRegistryAzureTenantId }}
        allow-no-subscriptions: true

    - name: Get ACR access token
      if: ${{ inputs.withPublish == 'true' && inputs.withRelease == 'true' && inputs.containerRegistry != '' && inputs.containerRegistryAzureClientId != '' && inputs.containerRegistryAzureTenantId != '' }}
      id: acr-token
      shell: pwsh
      run: |
        $acrToken = az acr login --name ${{ inputs.containerRegistry }} --expose-token --output tsv --query accessToken
        Write-Output "::add-mask::$acrToken" # mask the token in workflow logs
        "token=$acrToken" >> $env:GITHUB_OUTPUT

    - name: Docker login
      if: ${{ inputs.withPublish == 'true' && inputs.withRelease == 'true' && inputs.containerRegistry != '' && inputs.containerRegistryAzureClientId != '' && inputs.containerRegistryAzureTenantId != '' }}
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.containerRegistry }}
        username: 00000000-0000-0000-0000-000000000000
        password: ${{ steps.acr-token.outputs.token }}

    - name: Docker push
      if: ${{ inputs.withPublish == 'true' && inputs.withRelease == 'true' && inputs.containerRegistry != '' && inputs.containerRegistryAzureClientId != '' && inputs.containerRegistryAzureTenantId != '' }}
      shell: pwsh
      run: |
        $registry = "${{ inputs.containerRegistry }}"
        Write-Host "Using registry $registry"

        Get-ChildItem "${{ runner.temp }}/packages" -Recurse -Filter container.json |
          ForEach-Object {
            $container = Get-Content $_.FullName | ConvertFrom-Json
            $tag = "$registry/$($container.repository):$($container.version)"

            Write-Host "Pushing $tag"
            &docker tag "$($container.repository):$($container.version)" "$tag"
            &docker push "$tag"

            # Add registry to container.json
            $container | Add-Member -MemberType NoteProperty -Name registry -Value $registry -Force
            $container | ConvertTo-Json | Out-File -FilePath $_.FullName -Force
          }

    - name: Add publish output to pipeline artifacts
      if: ${{ inputs.withPublish == 'true' && inputs.withRelease == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: ${{ runner.temp }}/packages
